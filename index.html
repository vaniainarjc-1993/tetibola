:root {
  --bg: #F3F6F4; --surface: #FFFFFF; --surface-2: #EAF0ED; --ink: #10201C; --muted: #566A64; --line: #DCE5E1;
  --brand: #0B6E5B; --brand-2: #07483C; --brand-soft: #DDF0EA; --on-brand: #FFFFFF;
  --accent: #F2A93B; --on-accent: #2B1B00; --accent-soft: #FCEFD8;
  --in: #11875A; --in-soft: #DCF2E7; --out: #D0452D; --out-soft: #FBE3DD; --warn: #C27C12;
  --shadow-sm: 0 1px 2px rgba(16,32,28,.06);
  --shadow: 0 1px 2px rgba(16,32,28,.05), 0 6px 20px rgba(16,32,28,.07);
  --shadow-lg: 0 10px 30px rgba(7,72,60,.18);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B1412; --surface: #13201D; --surface-2: #1A2A26; --ink: #E4EEEA; --muted: #93A8A1; --line: #243632;
  --brand: #26A386; --brand-2: #0F5C4C; --brand-soft: #143A31; --on-brand: #FFFFFF;
  --accent: #F5B955; --on-accent: #2B1B00; --accent-soft: #3A2C14;
  --in: #3FCB8E; --in-soft: #123526; --out: #F27B63; --out-soft: #3B1F19; --warn: #F0B04A;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28); --shadow-lg: 0 12px 32px rgba(0,0,0,.4);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0B1412; --surface: #13201D; --surface-2: #1A2A26; --ink: #E4EEEA; --muted: #93A8A1; --line: #243632;
  --brand: #26A386; --brand-2: #0F5C4C; --brand-soft: #143A31; --on-brand: #FFFFFF;
  --accent: #F5B955; --on-accent: #2B1B00; --accent-soft: #3A2C14;
  --in: #3FCB8E; --in-soft: #123526; --out: #F27B63; --out-soft: #3B1F19; --warn: #F0B04A;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28); --shadow-lg: 0 12px 32px rgba(0,0,0,.4);
  color-scheme: dark }

*, *::before, *::after { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased }
.app { max-width: 1160px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 112px; display: flex; flex-direction: column; gap: 18px }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.015em }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: var(--on-brand); border-radius: 20px; padding: 16px 18px; box-shadow: var(--shadow-lg); position: relative; overflow: hidden }
.top::after { content: ""; position: absolute; right: -60px; top: -80px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.14), transparent 70%); pointer-events: none }
.brand { display: flex; align-items: center; gap: 12px; position: relative }
.mark { width: 44px; height: 44px; border-radius: 13px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 4px 12px rgba(0,0,0,.18) }
.mark svg { width: 26px; height: 26px }
.brand h1 { font-size: 24px; line-height: 1.05 }
.brand p { margin: 0; opacity: .8; font-size: 13px }
.month { display: flex; align-items: center; gap: 2px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 4px; position: relative }
.month button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: transparent; color: inherit; font-size: 20px; line-height: 1 }
.month button:hover { background: rgba(255,255,255,.18) }
.month span { min-width: 140px; text-align: center; font-weight: 700; text-transform: capitalize }

/* Tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; overflow: visible; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-sm) }
.tabs::-webkit-scrollbar { display: none }
.tabs button { flex: none; display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; padding: 8px 12px; border-radius: 10px; font-weight: 700; font-size: 14px; color: var(--muted) }
.tabs button svg { width: 18px; height: 18px; flex: none }
.tabs button:hover { color: var(--ink); background: var(--surface-2) }
.tabs button[aria-selected="true"] { color: var(--brand); background: var(--brand-soft) }
@media (max-width: 640px) { .tabs { flex-wrap: wrap; gap: 4px } .tabs button { padding: 7px 10px; font-size: 13px } }

.banner { background: var(--accent-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 14px; border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent) }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; box-shadow: var(--shadow-sm) }
.card h2 { font-size: 17px; margin-bottom: 12px }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 14px }
.card-head h2 { margin: 0 }
.grid { display: grid; gap: 16px }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)) }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 12px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden }
.kpi .lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 6px }
.kpi .lbl::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--k, var(--brand)) }
.kpi.k-in { --k: var(--in) } .kpi.k-out { --k: var(--out) } .kpi.k-acc { --k: var(--accent) }
.kpi .val { font: 700 26px/1.2 var(--f-display); letter-spacing: -.02em; overflow-wrap: anywhere }
.kpi .sub { font-size: 13px; color: var(--muted) }
.kpi.hero { background: linear-gradient(140deg, var(--brand), var(--brand-2)); color: var(--on-brand); border-color: transparent; box-shadow: var(--shadow-lg) }
.kpi.hero .lbl, .kpi.hero .sub { color: rgba(255,255,255,.8) }
.kpi.hero .lbl::before { background: var(--accent) }
.pos { color: var(--in) } .neg { color: var(--out) }
.kpi.hero .neg { color: #FFD0C6 }

.link { background: none; border: 0; color: var(--brand); font-weight: 700; padding: 0 }
.link:hover { text-decoration: underline; text-underline-offset: 3px }
.muted { color: var(--muted) }
.small { font-size: 13px }

/* Category bars */
.cats { display: flex; flex-direction: column; gap: 14px }
.cat-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: 14px; align-items: center }
.cat-row .name { min-width: 0; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.cat-row .amt { text-align: right; font-weight: 700 }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; background: var(--c, var(--muted)) }
.bar { grid-column: 1 / -1; position: relative; height: 8px; background: var(--surface-2); border-radius: 4px }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--c, var(--brand)) }
.bar i.ok { background: var(--in) } .bar i.warn { background: var(--warn) } .bar i.over { background: var(--out) }
.bar b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); opacity: .45; border-radius: 1px }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted) }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block }
.chart-wrap { overflow-x: auto }
.chart-wrap svg { display: block; width: 100%; min-width: 320px; height: auto }

/* Donut */
.donut-wrap { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 20px; align-items: center }
@media (max-width: 520px) { .donut-wrap { grid-template-columns: 1fr; justify-items: center } }
.donut-wrap svg { width: 190px; height: 190px; max-width: 100% }
.donut-legend { display: flex; flex-direction: column; gap: 8px; width: 100%; min-width: 0 }
.donut-legend > div { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: center; font-size: 14px }
.donut-legend .n { overflow-wrap: anywhere }
.donut-legend .p { color: var(--muted); font-size: 12px; min-width: 36px; text-align: right }
.donut-legend strong { white-space: nowrap }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap }
.pill.ok { background: var(--in-soft); color: var(--in) }
.pill.warn { background: var(--accent-soft); color: var(--warn) }
.pill.over { background: var(--out-soft); color: var(--out) }
.alerts { display: flex; flex-wrap: wrap; gap: 8px }

/* Forms & filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end }
.filters label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 700; min-width: 0; flex: 1 1 150px }
select, input[type="text"], input[type="date"], input:not([type]) { width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; font-size: 15px; transition: border-color .15s }
select:hover, input:hover { border-color: color-mix(in srgb, var(--brand) 40%, var(--line)) }
input[type="color"] { width: 48px; height: 42px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface) }

/* Transactions */
.day { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 800; padding: 16px 0 6px }
.tx { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 8px; margin-inline: -8px; border-radius: 12px }
.tx:hover { background: var(--surface-2) }
.tx .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font: 800 13px var(--f-display); color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent) }
.tx .ico.transfer { --c: var(--muted); font-size: 17px }
.tx .main { min-width: 0 }
.tx .t1 { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tx .t2 { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tx .right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px }
.tx .money { font-weight: 800 }
.tx .acts { display: flex; gap: 10px; font-size: 13px }
.tx .acts button { background: none; border: 0; color: var(--muted); padding: 0; text-decoration: underline; text-underline-offset: 2px }
.tx .acts button.danger { color: var(--out) }
.sumline { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; font-weight: 700; padding-bottom: 4px }

/* Buttons */
.btn { border: 1px solid transparent; border-radius: 11px; padding: 10px 16px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; transition: transform .1s, box-shadow .15s, background .15s }
.btn:active { transform: translateY(1px) }
.btn.primary { background: var(--brand); color: var(--on-brand); box-shadow: 0 2px 8px color-mix(in srgb, var(--brand) 35%, transparent) }
.btn.primary:hover { background: var(--brand-2) }
.btn.ghost { background: var(--surface); border-color: var(--line) }
.btn.ghost:hover { background: var(--surface-2) }
.btn.danger { background: var(--out); color: #fff }
.btn.sm { padding: 7px 12px; font-size: 14px }
.fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 999px; padding: 14px 22px; font-weight: 800; font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.22) }
.fab:hover { filter: brightness(1.05) }

/* Goals */
.goals { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px }
.goal { display: flex; flex-direction: column; gap: 10px }
.goal h3 { font-size: 18px }
.goal .big { font: 700 22px var(--f-display) }
.goal .bar { height: 10px }
.goal .meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted) }
.goal ul { list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--muted) }
.goal li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0 }
.goal .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto }

/* Settings chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--brand-soft); color: var(--ink); border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 14px; font-weight: 600 }
.chip button { border: 0; background: none; width: 22px; height: 22px; border-radius: 50%; color: var(--muted); font-size: 16px; line-height: 1 }
.chip button:hover { background: var(--surface); color: var(--out) }
.addrow { display: flex; gap: 8px }
.addrow input { flex: 1 }

/* Empty */
.empty { text-align: center; padding: 32px 16px; color: var(--muted) }
.empty h3 { color: var(--ink); font-size: 19px; margin-bottom: 6px }
.empty p { max-width: 48ch; margin: 0 auto 16px }

/* Dialog */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(5,15,12,.5); backdrop-filter: blur(3px); display: flex; align-items: flex-end; justify-content: center; padding: 16px }
@media (min-width: 640px) { .overlay { align-items: center } }
.dialog { background: var(--surface); border-radius: 20px; width: 100%; max-width: 500px; max-height: calc(100% - 16px); overflow-y: auto; padding: 22px; box-shadow: var(--shadow-lg); border: 1px solid var(--line) }
.dialog form { display: flex; flex-direction: column; gap: 14px }
.dialog h2 { font-size: 21px }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0 }
.field > span { font-size: 13px; font-weight: 700; color: var(--muted) }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px }
.amtbox { display: flex; align-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding-right: 14px }
.amtbox input { border: 0; font: 700 26px var(--f-display); padding: 10px 14px; background: transparent; letter-spacing: -.01em }
.amtbox input:focus { outline: none } .amtbox:focus-within { outline: 2px solid var(--brand); outline-offset: 1px; background: var(--surface) }
.amtbox em { font-style: normal; font-weight: 800; color: var(--muted) }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px }
.seg.three { grid-template-columns: repeat(3, 1fr) }
.seg label { position: relative }
.seg input { position: absolute; opacity: 0; inset: 0 }
.seg span { display: block; text-align: center; padding: 9px 6px; border-radius: 9px; font-weight: 800; color: var(--muted) }
.seg input:checked + span { background: var(--surface); color: var(--ink); box-shadow: var(--shadow) }
.seg input[value="out"]:checked + span { color: var(--out) }
.seg input[value="in"]:checked + span { color: var(--in) }
.seg input:focus-visible + span { outline: 2px solid var(--brand) }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap }
.budget-list { display: flex; flex-direction: column; gap: 8px }
.budget-list label { display: grid; grid-template-columns: auto minmax(0, 1fr) 150px; gap: 10px; align-items: center; font-size: 14px }
.budget-list input { text-align: right }
.err { color: var(--out); font-size: 13px; min-height: 1em; margin: 0 }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; max-width: calc(100% - 32px); box-shadow: var(--shadow-lg) }
.foot { font-size: 12px; color: var(--muted); text-align: center }

/* Wallets */
.wallets { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 18px }
.wallet { display: flex; flex-direction: column; gap: 12px; padding: 12px }
.wcard { position: relative; overflow: hidden; border-radius: 16px; padding: 16px 18px; min-height: 170px; display: flex; flex-direction: column; gap: 6px;
  background: linear-gradient(135deg, var(--wc) 0%, color-mix(in srgb, var(--wc) 72%, #000) 100%); color: var(--wc-ink); box-shadow: 0 8px 22px color-mix(in srgb, var(--wc) 35%, transparent) }
.wcard::before { content: ""; position: absolute; right: -40px; bottom: -70px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,.12) }
.wcard::after { content: ""; position: absolute; right: 40px; top: -60px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.08) }
.wc-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: relative; z-index: 1 }
.wc-prov { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; opacity: .85; text-align: right; overflow-wrap: anywhere }
.wc-name { font: 700 17px var(--f-display); margin-top: auto; position: relative; z-index: 1; overflow-wrap: anywhere }
.wc-bal { font: 700 28px/1.1 var(--f-display); letter-spacing: -.02em; position: relative; z-index: 1; overflow-wrap: anywhere }
.wc-flows { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; font-weight: 700; opacity: .9; position: relative; z-index: 1 }
.wmono { display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; font: 800 12px/1 var(--f-display); letter-spacing: -.02em; flex: none; object-fit: contain; overflow: hidden; text-align: center }
.wmono.s { width: 28px; height: 28px; border-radius: 8px; font-size: 9.5px }
.wcard .wmono { background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.15) }
.wline { display: inline-flex; align-items: center; gap: 10px; min-width: 0 }
.wallet .row { display: flex; flex-wrap: wrap; gap: 6px }
.wallet .row .btn { padding: 6px 10px; font-size: 13px }
.logo-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
.quick { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center }
.quick button { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 12px 8px 8px; font-weight: 700 }
.quick button:hover { border-color: var(--brand) }

.mini-list { display: flex; flex-direction: column; gap: 10px }
.mini-list > div { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px }
.mini-list > div > span:first-child { min-width: 0; overflow-wrap: anywhere }
.mini-list strong { white-space: nowrap }

/* Tables */
.table-wrap { overflow-x: auto; margin-inline: -18px; padding-inline: 18px }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 800; background: var(--surface-2) }
th:first-child { border-radius: 8px 0 0 8px } th:last-child { border-radius: 0 8px 8px 0 }
th:first-child, td:first-child, th.l, td.l { text-align: left }
tbody tr:hover td { background: color-mix(in srgb, var(--brand-soft) 50%, transparent) }
tr.paid td { color: var(--muted) }
tr.next td { background: var(--accent-soft) }
tr.sub td { font-weight: 800; background: var(--surface-2) }
tr.total td { font-weight: 800; border-top: 2px solid var(--brand); border-bottom: 0 }
td .link { font-size: 13px }
.pickrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.pickrow button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 14px }
.pickrow button:hover { background: var(--surface-2) }
.pickrow button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); border-color: var(--brand) }
.preview { background: var(--brand-soft); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 120px), 1fr)); gap: 8px }
.preview div { display: flex; flex-direction: column }
.preview span { font-size: 12px; color: var(--muted); font-weight: 700 }
.preview strong { font: 700 17px var(--f-display) }
.catstable td:first-child { white-space: normal; min-width: 150px; overflow-wrap: break-word }
.catstable td .x { border: 0; background: none; color: var(--muted); font-size: 16px; width: 26px; height: 26px; border-radius: 50% }
.catstable td .x:hover { background: var(--out-soft); color: var(--out) }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px }
.bnav { display: none }
.more-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px }
.more-grid button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; font-weight: 700; font-size: 13px; color: var(--ink) }

  .fab { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); right: 14px; padding: 13px 18px }
  .toast { bottom: calc(140px + env(safe-area-inset-bottom, 0px)) }

}

@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .4s ease } .donut-wrap circle { transition: stroke-dasharray .4s ease } }

/* ================= Thème « iOS » ================= */
:root {
  --f-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --f-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --bg: #F2F2F7; --surface: #FFFFFF; --surface-2: #F2F2F7; --fill: rgba(118,118,128,.12);
  --ink: #000000; --muted: rgba(60,60,67,.6); --line: rgba(60,60,67,.18);
  --brand: #007AFF; --brand-2: #0062CC; --brand-soft: rgba(0,122,255,.12); --on-brand: #FFFFFF;
  --accent: #007AFF; --on-accent: #FFFFFF; --accent-soft: rgba(255,149,0,.14);
  --in: #34C759; --in-soft: rgba(52,199,89,.14); --out: #FF3B30; --out-soft: rgba(255,59,48,.12); --warn: #FF9500;
  --shadow-sm: none; --shadow: 0 2px 10px rgba(0,0,0,.06); --shadow-lg: 0 10px 30px rgba(0,0,0,.12);
  --r: 14px; --bar: rgba(249,249,249,.82);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --surface: #1C1C1E; --surface-2: #2C2C2E; --fill: rgba(118,118,128,.24);
  --ink: #FFFFFF; --muted: rgba(235,235,245,.6); --line: rgba(84,84,88,.6);
  --brand: #0A84FF; --brand-2: #0071E3; --brand-soft: rgba(10,132,255,.2); --accent: #0A84FF; --accent-soft: rgba(255,159,10,.18);
  --in: #30D158; --in-soft: rgba(48,209,88,.18); --out: #FF453A; --out-soft: rgba(255,69,58,.18); --warn: #FF9F0A;
  --shadow: none; --shadow-lg: 0 10px 30px rgba(0,0,0,.5); --bar: rgba(22,22,24,.82); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1C1C1E; --surface-2: #2C2C2E; --fill: rgba(118,118,128,.24);
  --ink: #FFFFFF; --muted: rgba(235,235,245,.6); --line: rgba(84,84,88,.6);
  --brand: #0A84FF; --brand-2: #0071E3; --brand-soft: rgba(10,132,255,.2); --accent: #0A84FF; --accent-soft: rgba(255,159,10,.18);
  --in: #30D158; --in-soft: rgba(48,209,88,.18); --out: #FF453A; --out-soft: rgba(255,69,58,.18); --warn: #FF9F0A;
  --shadow: none; --shadow-lg: 0 10px 30px rgba(0,0,0,.5); --bar: rgba(22,22,24,.82); color-scheme: dark }
/* couleurs d'accent au choix (Paramètres → Apparence) */
:root[data-accent="green"] { --brand: #34C759; --brand-2: #248A3D; --brand-soft: rgba(52,199,89,.14); --accent: #34C759 }
:root[data-accent="indigo"] { --brand: #5856D6; --brand-2: #3634A3; --brand-soft: rgba(88,86,214,.13); --accent: #5856D6 }
:root[data-accent="orange"] { --brand: #FF9500; --brand-2: #C93400; --brand-soft: rgba(255,149,0,.14); --accent: #FF9500 }
:root[data-accent="pink"] { --brand: #FF2D55; --brand-2: #D30F45; --brand-soft: rgba(255,45,85,.12); --accent: #FF2D55 }
:root[data-accent="teal"] { --brand: #0B8A73; --brand-2: #07483C; --brand-soft: rgba(11,138,115,.13); --accent: #0B8A73 }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-accent="green"] { --brand: #30D158; --brand-soft: rgba(48,209,88,.2); --accent: #30D158 }
  :root:not([data-theme="light"])[data-accent="indigo"] { --brand: #5E5CE6; --brand-soft: rgba(94,92,230,.24); --accent: #5E5CE6 }
  :root:not([data-theme="light"])[data-accent="orange"] { --brand: #FF9F0A; --brand-soft: rgba(255,159,10,.2); --accent: #FF9F0A }
  :root:not([data-theme="light"])[data-accent="pink"] { --brand: #FF375F; --brand-soft: rgba(255,55,95,.2); --accent: #FF375F }
  :root:not([data-theme="light"])[data-accent="teal"] { --brand: #2EC4A5; --brand-soft: rgba(46,196,165,.2); --accent: #2EC4A5 }
}
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); letter-spacing: -.01em; -webkit-tap-highlight-color: transparent }
h1, h2, h3, .kpi .val, .wc-bal, .wc-name, .dg-total, .big, .amtbox input { font-family: var(--f-display); letter-spacing: -.02em }

/* Barre de navigation iOS : petit en-tête flou + grand titre */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25; background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  color: var(--ink); border-radius: 0; box-shadow: none; padding: 10px 16px; margin-inline: -16px; border-bottom: .5px solid transparent; transition: border-color .2s }
.top::after { display: none }
body.scrolled .top { border-bottom-color: var(--line) }
.brand { gap: 10px }
.mark { width: 32px; height: 32px; border-radius: 8px; background: var(--brand); color: #fff; box-shadow: none }
.mark svg { width: 19px; height: 19px }
.brand .app-name { font: 600 17px var(--f-display); display: block }
.brand p { font-size: 12px; color: var(--muted); opacity: 1 }
.month { background: var(--fill); border: 0; padding: 2px; color: var(--ink) }
.month button { color: var(--brand); font-size: 22px; width: 32px; height: 32px }
.month button:hover { background: transparent; opacity: .7 }
.month span { font-weight: 600; font-size: 15px; min-width: 130px }
.large-title { font: 800 34px/1.15 var(--f-display); letter-spacing: -.03em; margin: 2px 0 -4px; transition: opacity .2s, transform .2s }
body.scrolled .large-title { opacity: .0; transform: translateY(-6px) }
.app { gap: 16px; padding-block: 0 110px }

/* Onglets (ordinateur) : contrôle segmenté */
.tabs { background: var(--fill); border: 0; box-shadow: none; border-radius: 10px; padding: 3px; gap: 2px }
.tabs button { color: var(--ink); font-weight: 600; font-size: 13.5px; border-radius: 8px; padding: 7px 11px }
.tabs button svg { color: var(--brand) }
.tabs button:hover { background: transparent; opacity: .75 }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04) }

/* Cartes groupées iOS */
.card { border: 0; box-shadow: none; border-radius: var(--r) }
.card h2 { font-size: 20px; font-weight: 700 }
.kpi { border: 0; box-shadow: none; border-radius: 18px }
.kpi .lbl { font-size: 12px; letter-spacing: 0; text-transform: none; font-weight: 600 }
.kpi .val { font-weight: 700 }
.kpi.hero { background: linear-gradient(145deg, var(--brand), var(--brand-2)); box-shadow: 0 8px 24px color-mix(in srgb, var(--brand) 30%, transparent) }
.kpi.hero .lbl::before { background: rgba(255,255,255,.85) }
.day { text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 600 }
.tx { border-radius: 10px }
.tx .ico { border-radius: 50% }
th { background: transparent; text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 600 }
.banner { border: 0; border-radius: 12px; background: var(--accent-soft) }
.pill { font-weight: 600 }
.bar { height: 6px; border-radius: 3px; background: var(--fill) } .bar i { border-radius: 3px }

/* Boutons iOS */
.btn { border-radius: 12px; font-weight: 600; border: 0 }
.btn.primary { background: var(--brand); color: var(--on-brand); box-shadow: none }
.btn.primary:hover { background: var(--brand); filter: brightness(1.08) }
.btn.ghost { background: var(--fill); color: var(--brand) }
.btn.ghost:hover { background: var(--fill); opacity: .8 }
.btn.danger { background: var(--out-soft); color: var(--out) }
.btn:active, .pickrow button:active, .tabs button:active, .bnav button:active, .ai-actions button:active, .quick button:active, .wcard[data-act]:active, .kpi:active { transform: scale(.97) }
.pickrow button { border: 0; background: var(--fill); color: var(--brand); font-weight: 600 }
.pickrow button:hover { background: var(--fill); opacity: .8 }
.pickrow button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand) }
.link { color: var(--brand); font-weight: 600 }
.fab { background: var(--brand); color: var(--on-brand); font-weight: 600; box-shadow: 0 8px 24px color-mix(in srgb, var(--brand) 40%, transparent) }
.dm-btn { border: 0; background: var(--brand-soft); color: var(--brand); font-weight: 600 }
.ok-btn { border-color: var(--brand) !important }

/* Champs iOS */
select, input[type="text"], input[type="date"], input:not([type]), input[type="password"] { background: var(--fill); border: 0; border-radius: 10px; color: var(--ink) }
select:hover, input:hover { border-color: transparent }
.amtbox { background: var(--fill); border: 0; border-radius: 12px }
.amtbox:focus-within { background: var(--fill); outline: 2px solid var(--brand) }
.amtbox input { background: transparent !important }
.field > span, .filters label { font-weight: 500; text-transform: none }
.seg { background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px }
.seg span { border-radius: 7px; font-weight: 600; padding: 7px 6px }
.seg input:checked + span { background: var(--surface); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04) }
/* Interrupteurs iOS */
input[type="checkbox"] { -webkit-appearance: none; appearance: none; width: 51px; height: 31px; border-radius: 31px; background: var(--fill); position: relative; flex: none; cursor: pointer; transition: background .25s; margin: 0 }
input[type="checkbox"]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: transform .25s cubic-bezier(.3,.7,.4,1.2) }
input[type="checkbox"]:checked { background: var(--in) }
input[type="checkbox"]:checked::after { transform: translateX(20px) }
.check { justify-content: space-between; flex-direction: row-reverse; gap: 12px }

/* Feuilles (dialogues) iOS */
.overlay { background: rgba(0,0,0,.35); -webkit-backdrop-filter: none; backdrop-filter: none }
.overlay:not([hidden]) { animation: fadeIn .25s ease }
.dialog { border: 0; border-radius: 14px; background: var(--surface) }
.overlay:not([hidden]) .dialog { animation: sheetUp .38s cubic-bezier(.2,.9,.25,1.02) }
@media (max-width: 640px) {
  .dialog { border-radius: 12px 12px 0 0; padding-top: 22px; position: relative }
  .dialog::before { content: ""; position: absolute; top: 7px; left: 50%; transform: translateX(-50%); width: 36px; height: 5px; border-radius: 3px; background: var(--line) }
  .large-title { font-size: 30px }
  .top { padding: 8px 16px }
  .month span { min-width: 0 }
}
/* Barre d'onglets iOS (téléphone) */
@media (max-width: 640px) {
  .bnav { background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--line); box-shadow: none; padding-top: 4px }
  .bnav button { color: rgba(120,120,128,.9); font-weight: 500; font-size: 10px; min-height: 48px }
  .bnav button[aria-selected="true"] { color: var(--brand); background: transparent }
  .bnav button[aria-selected="true"] svg { stroke-width: 2.4 }
  .fab { bottom: calc(74px + env(safe-area-inset-bottom, 0px)) }
}
/* Notification façon « Dynamic Island » */
.toast { top: calc(10px + env(safe-area-inset-top, 0px)); bottom: auto; background: #000; color: #fff; border-radius: 22px; padding: 11px 18px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.25) }
.toast:not([hidden]) { animation: island .45s cubic-bezier(.2,.9,.25,1.15) }
/* Transitions entre écrans */
#view.enter { animation: viewIn .3s cubic-bezier(.2,.8,.2,1) }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
@keyframes sheetUp { from { transform: translateY(40px); opacity: .4 } to { transform: none; opacity: 1 } }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
@keyframes island { 0% { transform: translateX(-50%) scale(.6, .5); opacity: 0 } 60% { transform: translateX(-50%) scale(1.03, 1.03); opacity: 1 } 100% { transform: translateX(-50%) scale(1) } }
@media (prefers-reduced-motion: reduce) { #view.enter, .overlay:not([hidden]) .dialog, .toast:not([hidden]), .overlay:not([hidden]) { animation: none } }
/* Apparence */
.accent-row { display: flex; gap: 12px; flex-wrap: wrap }
.accent-row button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--c); cursor: pointer; box-shadow: 0 0 0 2px var(--surface), 0 0 0 2px var(--surface) }
.accent-row button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--c) }

/* ================= Personnalisation (Paramètres → Apparence) ================= */
:root {
  --tex-points: radial-gradient(color-mix(in srgb, var(--ink) 11%, transparent) 1px, transparent 1.6px) 0 0 / 18px 18px;
  --tex-lignes: repeating-linear-gradient(45deg, color-mix(in srgb, var(--ink) 5%, transparent) 0 1px, transparent 1px 11px);
  --tex-carreaux: linear-gradient(color-mix(in srgb, var(--ink) 6%, transparent) 1px, transparent 1px) 0 0 / 22px 22px, linear-gradient(90deg, color-mix(in srgb, var(--ink) 6%, transparent) 1px, transparent 1px) 0 0 / 22px 22px;
  --tex-tissage: repeating-linear-gradient(0deg, color-mix(in srgb, var(--brand) 8%, transparent) 0 2px, transparent 2px 12px), repeating-linear-gradient(90deg, color-mix(in srgb, var(--warn) 8%, transparent) 0 2px, transparent 2px 12px);
  --tex-degrade: radial-gradient(circle at 0% 0%, color-mix(in srgb, var(--brand) 18%, transparent), transparent 45%), radial-gradient(circle at 100% 35%, color-mix(in srgb, var(--warn) 14%, transparent), transparent 42%), radial-gradient(circle at 30% 100%, color-mix(in srgb, var(--in) 12%, transparent), transparent 45%);
}
body { background: var(--tex, none), var(--bg); background-attachment: fixed }
:root[data-tex="points"] { --tex: var(--tex-points) }
:root[data-tex="lignes"] { --tex: var(--tex-lignes) }
:root[data-tex="carreaux"] { --tex: var(--tex-carreaux) }
:root[data-tex="tissage"] { --tex: var(--tex-tissage) }
:root[data-tex="degrade"] { --tex: var(--tex-degrade) }
/* couleurs de fond */
:root[data-bgc="creme"] { --bg: #F6F1E7 } :root[data-bgc="menthe"] { --bg: #E8F4EE } :root[data-bgc="ciel"] { --bg: #E8F1FB } :root[data-bgc="lavande"] { --bg: #EFEDFA } :root[data-bgc="rose"] { --bg: #FBEEF1 } :root[data-bgc="sable"] { --bg: #EFE9E1 }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-bgc="creme"] { --bg: #15120C } :root:not([data-theme="light"])[data-bgc="menthe"] { --bg: #08140F } :root:not([data-theme="light"])[data-bgc="ciel"] { --bg: #08111C }
  :root:not([data-theme="light"])[data-bgc="lavande"] { --bg: #100E1B } :root:not([data-theme="light"])[data-bgc="rose"] { --bg: #180C10 } :root:not([data-theme="light"])[data-bgc="sable"] { --bg: #16130F } }
:root[data-theme="dark"][data-bgc="creme"] { --bg: #15120C } :root[data-theme="dark"][data-bgc="menthe"] { --bg: #08140F } :root[data-theme="dark"][data-bgc="ciel"] { --bg: #08111C }
:root[data-theme="dark"][data-bgc="lavande"] { --bg: #100E1B } :root[data-theme="dark"][data-bgc="rose"] { --bg: #180C10 } :root[data-theme="dark"][data-bgc="sable"] { --bg: #16130F }
/* polices */
:root[data-font="arrondie"] { --f-body: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif; --f-display: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif }
:root[data-font="moderne"] { --f-body: "Manrope", "Segoe UI", system-ui, sans-serif; --f-display: "Manrope", "Segoe UI", system-ui, sans-serif }
:root[data-font="geometrique"] { --f-body: "Poppins", "Segoe UI", system-ui, sans-serif; --f-display: "Poppins", "Segoe UI", system-ui, sans-serif }
:root[data-font="classique"] { --f-body: "Lora", ui-serif, Georgia, serif; --f-display: ui-serif, "New York", "Lora", Georgia, serif }
:root[data-font="lisible"] { --f-body: "Atkinson Hyperlegible", Verdana, system-ui, sans-serif; --f-display: "Atkinson Hyperlegible", Verdana, system-ui, sans-serif }
/* taille du texte */
:root[data-size="s"] body { zoom: .92 } :root[data-size="l"] body { zoom: 1.1 } :root[data-size="xl"] body { zoom: 1.22 }
/* thèmes de présentation */
:root[data-skin="emeraude"] .top { position: relative; top: 0; margin: 12px 0 0; border-radius: 20px; padding: 16px 18px; color: #fff; background: linear-gradient(135deg, var(--brand), var(--brand-2)); -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: 0 10px 30px color-mix(in srgb, var(--brand) 30%, transparent) }
:root[data-skin="emeraude"] .brand p { color: rgba(255,255,255,.8) } :root[data-skin="emeraude"] .mark { background: rgba(255,255,255,.2) }
:root[data-skin="emeraude"] .month { background: rgba(255,255,255,.18); color: #fff } :root[data-skin="emeraude"] .month button { color: #fff }
:root[data-skin="emeraude"] .card, :root[data-skin="emeraude"] .kpi { border: 1px solid var(--line) }
:root[data-skin="minimal"] .card, :root[data-skin="minimal"] .kpi, :root[data-skin="minimal"] .due-group { border: 1px solid var(--line); border-radius: 8px; box-shadow: none }
:root[data-skin="minimal"] .kpi.hero { background: var(--surface); color: var(--ink); border: 2px solid var(--brand); box-shadow: none }
:root[data-skin="minimal"] .kpi.hero .lbl, :root[data-skin="minimal"] .kpi.hero .sub { color: var(--muted) } :root[data-skin="minimal"] .kpi.hero .lbl::before { background: var(--brand) }
:root[data-skin="minimal"] .btn, :root[data-skin="minimal"] .pickrow button, :root[data-skin="minimal"] select, :root[data-skin="minimal"] input:not([type="checkbox"]), :root[data-skin="minimal"] .amtbox { border-radius: 6px }
:root[data-skin="minimal"] .tabs { background: transparent; border-bottom: 1px solid var(--line); border-radius: 0 } :root[data-skin="minimal"] .tabs button[aria-selected="true"] { box-shadow: inset 0 -2px 0 var(--brand); background: transparent; border-radius: 0 }
:root[data-skin="minimal"] .wcard { border-radius: 10px }
:root[data-skin="doux"] .card, :root[data-skin="doux"] .kpi, :root[data-skin="doux"] .due-group { border-radius: 26px; box-shadow: 0 10px 30px rgba(0,0,0,.06) }
:root[data-skin="doux"] .btn, :root[data-skin="doux"] .pickrow button, :root[data-skin="doux"] .tabs, :root[data-skin="doux"] .tabs button { border-radius: 999px }
:root[data-skin="doux"] select, :root[data-skin="doux"] input:not([type="checkbox"]), :root[data-skin="doux"] .amtbox { border-radius: 16px } :root[data-skin="doux"] .wcard { border-radius: 24px }
:root[data-skin="contraste"] { --muted: #3A3A3C; --line: rgba(0,0,0,.45) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"])[data-skin="contraste"] { --muted: #E5E5EA; --line: rgba(255,255,255,.5) } }
:root[data-theme="dark"][data-skin="contraste"] { --muted: #E5E5EA; --line: rgba(255,255,255,.5) }
:root[data-skin="contraste"] body { font-weight: 500 } :root[data-skin="contraste"] .card, :root[data-skin="contraste"] .kpi { border: 1.5px solid var(--line) }
:root[data-skin="contraste"] .link, :root[data-skin="contraste"] .tx .acts button { text-decoration: underline } :root[data-skin="contraste"] :focus-visible { outline-width: 3px }
:root[data-skin="compact"] .app { gap: 10px } :root[data-skin="compact"] .card { padding: 11px 12px } :root[data-skin="compact"] .kpi { padding: 9px 11px }
:root[data-skin="compact"] .kpi .val { font-size: 20px } :root[data-skin="compact"] .large-title { font-size: 26px } :root[data-skin="compact"] .card h2 { font-size: 16px; margin-bottom: 8px }
:root[data-skin="compact"] .tx { padding-block: 5px } :root[data-skin="compact"] .grid, :root[data-skin="compact"] .kpis { gap: 10px }
/* panneau Apparence */
.mini-list > div > span:last-child, .mini-list > div > strong { white-space: nowrap }
.look-sec { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line) }
.look-sec:first-of-type { border-top: 0; padding-top: 4px }
.look-sec > span { font-size: 13px; font-weight: 600; color: var(--muted) }
.look-opts { display: flex; flex-wrap: wrap; gap: 8px }
.look-opts button { border: 1px solid transparent; background: var(--fill); color: var(--ink); border-radius: 12px; padding: 8px 12px; font-weight: 600; font-size: 14px; cursor: pointer }
.look-opts button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); color: var(--brand) }
.look-opts button small { display: block; font-weight: 500; font-size: 11.5px; color: var(--muted) }
.look-opts .sw { width: 34px; height: 34px; padding: 0; border-radius: 50%; background: var(--c); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line) }
.look-opts .sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--brand); border-color: var(--surface); background: var(--c) }
.look-opts .tex { width: 64px; height: 46px; padding: 0; background: var(--t, none), var(--bg); border: 1px solid var(--line); display: flex; align-items: flex-end; justify-content: center; font-size: 10.5px; color: var(--muted); padding-bottom: 3px }
.look-opts .tex[aria-pressed="true"] { border: 2px solid var(--brand); background: var(--t, none), var(--bg); color: var(--brand) }

/* Logo Tetibola */
.mark.logo { background: transparent; box-shadow: none; width: 42px; height: 42px; border-radius: 0 }
.mark.logo img { width: 100%; height: 100%; object-fit: contain; display: block }
.brand .app-name { font-family: "Josefin Sans", var(--f-display); font-weight: 400; letter-spacing: .2em; text-transform: uppercase; color: var(--sand); font-size: 18px; line-height: 1.1 }
.brand p { font-family: "Josefin Sans", var(--f-body); font-size: 12.5px; letter-spacing: .01em }
:root { --sand: #B8976A }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sand: #D9C3A3 } }
:root[data-theme="dark"] { --sand: #D9C3A3 }
:root[data-skin="emeraude"] .mark.logo { background: rgba(255,255,255,.92); border-radius: 12px; padding: 3px }
:root[data-skin="emeraude"] .brand .app-name { color: #fff }
/* Couleurs du logo : sauge et sable */
:root[data-accent="sauge"] { --brand: #4F9580; --brand-2: #36705F; --brand-soft: rgba(79,149,128,.14); --accent: #4F9580 }
:root[data-accent="sable"] { --brand: #A7834F; --brand-2: #7E6036; --brand-soft: rgba(167,131,79,.15); --accent: #A7834F }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-accent="sauge"] { --brand: #8CCBB5; --brand-2: #4F9580; --brand-soft: rgba(140,203,181,.2); --accent: #8CCBB5; --on-brand: #0B1F18 }
  :root:not([data-theme="light"])[data-accent="sable"] { --brand: #D9C3A3; --brand-2: #A7834F; --brand-soft: rgba(217,195,163,.2); --accent: #D9C3A3; --on-brand: #1E160A } }
:root[data-theme="dark"][data-accent="sauge"] { --brand: #8CCBB5; --brand-2: #4F9580; --brand-soft: rgba(140,203,181,.2); --accent: #8CCBB5; --on-brand: #0B1F18 }
:root[data-theme="dark"][data-accent="sable"] { --brand: #D9C3A3; --brand-2: #A7834F; --brand-soft: rgba(217,195,163,.2); --accent: #D9C3A3; --on-brand: #1E160A }
:root[data-bgc="lin"] { --bg: #F7F5EF }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"])[data-bgc="lin"] { --bg: #0E0D0B } }
:root[data-theme="dark"][data-bgc="lin"] { --bg: #0E0D0B }

/* Aide */
.help-search { display: flex; gap: 8px; margin-top: 12px }
.help-search input { flex: 1 }
.quick-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px; margin-top: 12px }
.quick-steps > div { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px }
.quick-steps b.n { width: 24px; height: 24px; border-radius: 50%; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-size: 13px }
.quick-steps strong { font-size: 14.5px } .quick-steps span { font-size: 13px; color: var(--muted) }
.quick-steps .link { align-self: flex-start; font-size: 13px }
details.hs { border-top: 1px solid var(--line); padding: 2px 0 }
details.hs:first-of-type { border-top: 0 }
details.hs > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px 2px; font-weight: 700; font-size: 15.5px }
details.hs > summary::-webkit-details-marker { display: none }
details.hs > summary .hi { width: 34px; height: 34px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; flex: none }
details.hs > summary .hi svg { width: 19px; height: 19px }
details.hs > summary::after { content: "›"; margin-left: auto; font-size: 22px; color: var(--muted); transition: transform .2s }
details.hs[open] > summary::after { transform: rotate(90deg) }
details.hs .hb { padding: 0 2px 14px 46px; font-size: 14.5px; line-height: 1.6 }
details.hs .hb ol, details.hs .hb ul { margin: 4px 0 8px; padding-left: 20px } details.hs .hb li { margin: 3px 0 }
details.hs .hb p { margin: 4px 0 8px }
.kbd { display: inline-block; padding: 1px 7px; border-radius: 6px; background: var(--fill); font-weight: 600; font-size: 13px; white-space: nowrap }
.help-tip { background: var(--brand-soft); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; margin: 6px 0 8px }
.gloss { display: grid; grid-template-columns: minmax(110px, auto) 1fr; gap: 6px 14px; font-size: 14px }
.gloss dt { font-weight: 700 } .gloss dd { margin: 0; color: var(--muted) }
@media (max-width: 640px) { details.hs .hb { padding-left: 2px } .quick-steps { grid-template-columns: 1fr 1fr } .quick-steps > div > span { display: none } .quick-steps > div { padding: 10px 12px } }
.help-btn { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--fill); color: var(--brand); font: 700 17px var(--f-display); cursor: pointer; flex: none }
.top-right { display: flex; align-items: center; gap: 8px } @media (max-width: 640px) { .top-right { width: 100% } .top-right .month { flex: 1 } }
</style>

function gdLoadScript() {
  return new Promise((res, rej) => {
    if (window.google && google.accounts && google.accounts.oauth2) return res();
    const sc = document.createElement("script"); sc.src = "https://accounts.google.com/gsi/client"; sc.async = true;
    sc.onload = () => res(); sc.onerror = () => rej({ code: "script" }); document.head.appendChild(sc);
  });
}
async function gdAuth(first) {
  await gdLoadScript();
  return new Promise((res, rej) => {
    const tc = google.accounts.oauth2.initTokenClient({
      client_id: gdClientId(), scope: "https://www.googleapis.com/auth/drive.file",
      callback: r => { if (r.error) return rej({ code: "auth", detail: r.error }); GD.token = r.access_token; GD.exp = Date.now() + ((r.expires_in || 3600) - 90) * 1000; lsSet("tb-gd-on", "1"); res(); },
      error_callback: e => rej({ code: "auth", detail: e && e.type })
    });
    tc.requestAccessToken({ prompt: first ? "consent" : "" });
  });
}
async function gdFetch(url, opts = {}) {
  const r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: "Bearer " + GD.token } });
  if (r.status === 401 || r.status === 403) { GD.token = null; throw { code: "auth" }; }
  return r;
}
async function gdFindFile() {
  if (GD.fileId) return GD.fileId;
  const q = encodeURIComponent(`name='${GD_FILE}' and trashed=false`);
  const r = await gdFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&orderBy=modifiedTime%20desc&fields=files(id,modifiedTime)`);
  if (!r.ok) throw { code: "net" };
  const j = await r.json();
  GD.fileId = j.files && j.files[0] ? j.files[0].id : null;
  if (GD.fileId) lsSet("tb-gd-file", GD.fileId);
  return GD.fileId;
}
async function gdDownload(id) {
  const r = await gdFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
  if (r.status === 404) { GD.fileId = null; lsSet("tb-gd-file", ""); return null; }
  if (!r.ok) throw { code: "net" };
  try { return await r.json(); } catch (e) { return null; }
}
async function gdUpload(obj) {
  const body = JSON.stringify(obj);
  if (GD.fileId) {
    const r = await gdFetch(`https://www.googleapis.com/upload/drive/v3/files/${GD.fileId}?uploadType=media`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body });
    if (r.ok) return;
    if (r.status !== 404) throw { code: "net" };
    GD.fileId = null;
  }
  const bd = "tetibola" + Date.now();
  const meta = { name: GD_FILE, mimeType: "application/json", description: "Données de l'application Tetibola (budget familial). Ne pas modifier à la main." };
  const mp = `--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;
  const r = await gdFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", { method: "POST", headers: { "Content-Type": "multipart/related; boundary=" + bd }, body: mp });
  if (!r.ok) throw { code: "net" };
  const j = await r.json(); GD.fileId = j.id; lsSet("tb-gd-file", j.id);
}
function mergeData(a, b) {
  const out = { settings: null };
  ["tx", "goals", "wallets", "loans", "bills"].forEach(n => {
    out[n] = { ...((a && a[n]) || {}) };
    Object.entries((b && b[n]) || {}).forEach(([id, v]) => { const cur = out[n][id]; if (!cur || (v._u || 0) > (cur._u || 0)) out[n][id] = v; });
  });
  const sa = a && a.settings, sb = b && b.settings;
  out.settings = !sa ? sb || null : !sb ? sa : ((sb._u || 0) > (sa._u || 0) ? sb : sa);
  return out;
}
function gdSetStatus(st) { GD.status = st; refresh(); }
async function gdSync() {
  if (!gdOn()) return;
  if (GD.busy) { GD.again = true; return; }
  if (!GD.token || Date.now() > GD.exp) { gdSetStatus("reconnect"); return; }
  GD.busy = true; gdSetStatus("sync");
  try {
    const id = await gdFindFile();
    const remote = id ? await gdDownload(id) : null;
    const rData = remote && remote.data ? remote.data : null;
    const local = store.getData();
    const merged = rData ? mergeData(local, rData) : local;
    if (JSON.stringify(merged) !== JSON.stringify(local)) { GD.applying = true; store.replaceData(merged); GD.applying = false; }
    if (!rData || JSON.stringify(merged) !== JSON.stringify(rData)) await gdUpload({ app: "tetibola", version: 4, savedAt: new Date().toISOString(), data: merged });
    lsSet("tb-gd-last", String(Date.now())); lsSet("tb-lastbackup", String(Date.now()));
    GD.busy = false; gdSetStatus("ok");
  } catch (e) {
    GD.busy = false; GD.applying = false;
    gdSetStatus(e && e.code === "auth" ? "reconnect" : "error");
  }
  if (GD.again) { GD.again = false; setTimeout(gdSync, 400); }
}
async function gdConnect() {
  if (!gdHosted()) { toast("La synchronisation Google Drive fonctionne quand l'application est ouverte depuis son adresse https (GitHub Pages), pas depuis un fichier."); return; }
  if (!gdClientId()) { openGdConfig(); return; }
  try { await gdAuth(!lsGet("tb-gd-on")); toast("Connecté à Google Drive"); gdSync(); }
  catch (e) { toast(e && e.code === "script" ? "Impossible de joindre Google. Vérifiez la connexion internet." : "Connexion Google annulée ou refusée."); gdSetStatus(lsGet("tb-gd-on") ? "reconnect" : ""); }
}
function gdDisconnect() {
  try { if (GD.token && window.google) google.accounts.oauth2.revoke(GD.token, () => {}); } catch (e) {}
  GD.token = null; lsSet("tb-gd-on", ""); gdSetStatus(""); toast("Google Drive déconnecté sur cet appareil. Les données restent dans le navigateur et dans Drive.");
}
function openGdConfig() {
  const html = `<form id="dlgForm" novalidate><h2>ID client Google</h2>
    <p class="small muted" style="margin:0">Collez l'« ID client » OAuth créé dans Google Cloud (il se termine par <code>.apps.googleusercontent.com</code>). Il est enregistré sur cet appareil ; faites-le aussi sur le téléphone, ou demandez à l'intégrer directement dans le fichier.</p>
    <label class="field"><span>ID client</span><input id="gd-cid" name="cid" value="${esc(gdClientId())}" placeholder="123456789-abc.apps.googleusercontent.com" autocomplete="off"></label>${actions}</form>`;
  openDialog(html, async fd => {
    const v = String(fd.get("cid") || "").trim();
    if (!/\.apps\.googleusercontent\.com$/.test(v)) return "Cet identifiant ne ressemble pas à un ID client Google (…apps.googleusercontent.com).";
    lsSet("tb-gd-client", v); GD.token = null; toast("ID client enregistré"); refresh(); return true;
  });
}
function gdPanel() {
  const last = Number(lsGet("tb-gd-last") || 0);
  const lastTxt = last ? new Date(last).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "jamais";
  if (!gdHosted()) return `<p class="small">Pour synchroniser ordinateur et téléphone, ouvrez l'application depuis son adresse en ligne (GitHub Pages), pas depuis un fichier téléchargé. Voir le guide d'installation.</p>`;
  if (!gdClientId()) return `<p class="small">Enregistrez automatiquement vos données dans votre Google Drive et retrouvez-les sur tous vos appareils connectés au même compte Google.</p><div class="pickrow"><button type="button" data-act="gd-config" aria-pressed="true">Saisir l'ID client Google</button></div>`;
  if (!lsGet("tb-gd-on")) return `<p class="small">ID client enregistré. Connectez votre compte Google pour activer la synchronisation.</p><div class="pickrow"><button type="button" data-act="gd-connect" aria-pressed="true">Se connecter à Google Drive</button><button type="button" data-act="gd-config">Modifier l'ID client</button></div>`;
  const st = { sync: '<span class="pill info">Synchronisation…</span>', ok: '<span class="pill ok">À jour</span>', pending: '<span class="pill warn">Modifications en attente</span>', reconnect: '<span class="pill warn">Reconnexion nécessaire</span>', error: '<span class="pill over">Échec</span>' }[GD.status] || '<span class="pill neutral">Connecté</span>';
  return `<p class="small">${st} Dernière synchronisation : <strong>${lastTxt}</strong>. Fichier Drive : <code>${GD_FILE}</code>.</p>
    <div class="pickrow"><button type="button" data-act="${GD.token ? "gd-sync" : "gd-connect"}" aria-pressed="true">${GD.token ? "Synchroniser maintenant" : "Reconnecter Google Drive"}</button><button type="button" data-act="gd-disconnect">Déconnecter</button><button type="button" data-act="gd-config">Modifier l'ID client</button></div>
    <p class="small muted">Chaque modification est envoyée vers Drive quelques secondes après la saisie, et les données de l'autre appareil sont récupérées toutes les minutes. Google demande de reconnecter environ une fois par heure d'utilisation (un clic).</p>`;
}
function gdBannerMsg() {
  if (!gdOn() || !gdHosted()) return "";
  if (GD.status === "reconnect" || !GD.token) return `Google Drive : reconnectez-vous pour synchroniser. <button class="btn primary sm" data-act="gd-connect" style="margin-left:6px">Reconnecter</button>`;
  if (GD.status === "error") return `La synchronisation Google Drive a échoué (connexion internet ?). <button class="btn primary sm" data-act="gd-sync" style="margin-left:6px">Réessayer</button>`;
  return "";
}
window.addEventListener("tb-local-change", () => {
  if (GD.applying || !gdOn()) return;
  clearTimeout(GD.t); GD.t = setTimeout(gdSync, 2500);
  if (GD.token) GD.status = "pending";
});
setInterval(() => { if (document.visibilityState === "visible" && GD.token) gdSync(); }, 60000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && GD.token) gdSync(); });

/* ---------- Boot ---------- */
applyLook();
let scrollTick = false;
window.addEventListener("scroll", () => { if (scrollTick) return; scrollTick = true; requestAnimationFrame(() => { document.body.classList.toggle("scrolled", window.scrollY > 30); scrollTick = false; }); }, { passive: true });
async function boot() {
  render();
  let db = null;
  /* version locale : pas de synchronisation */
  store = db ? makeRemote(db) : makeLocal();
  state.mode = db ? "db" : "local";
  $("#foot").textContent = db ? "Données partagées et synchronisées entre les membres de la famille." : "";
  let first = true;
  store.subSettings(s => {
    state.settings = { ...structuredClone(DEFAULTS), ...(s || {}) };
    (first || ["tx", "cats", "detail"].includes(state.tab)) ? render() : refresh(); first = false;
  });
  store.sub("wallets", w => { state.wallets = w; subscribeTx(); state.tab === "tx" ? render() : refresh(); });
  store.sub("goals", g => { state.goals = g; refresh(); });
  store.sub("bills", x => { state.bills = x; refresh(); notifyDue(); });
  setInterval(() => { notifyDue(); refresh(); }, 36e5);
  store.sub("loans", l => { state.loans = l.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)); refresh(); });
  subscribeTx();
  render();
}
boot();
})();
