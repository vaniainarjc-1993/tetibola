<style>
html { color-scheme: light } body { margin: 0 } img { max-width: 100% }
/* Layout: app shell — brand header with month switcher, icon tab rail, one working view; floating "+ Opération".
   Color: deep emerald brand (ravinala green) + saffron accent; wallets wear their provider's color. */
:root {
  --bg: #F3F6F4; --surface: #FFFFFF; --surface-2: #EAF0ED; --ink: #10201C; --muted: #566A64; --line: #DCE5E1;
  --brand: #0B6E5B; --brand-2: #07483C; --brand-soft: #DDF0EA; --on-brand: #FFFFFF;
  --accent: #F2A93B; --on-accent: #2B1B00; --accent-soft: #FCEFD8;
  --in: #11875A; --in-soft: #DCF2E7; --out: #D0452D; --out-soft: #FBE3DD; --warn: #C27C12;
  --shadow-sm: 0 1px 2px rgba(16,32,28,.06);
  --shadow: 0 1px 2px rgba(16,32,28,.05), 0 6px 20px rgba(16,32,28,.07);
  --shadow-lg: 0 10px 30px rgba(7,72,60,.18);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B1412; --surface: #13201D; --surface-2: #1A2A26; --ink: #E4EEEA; --muted: #93A8A1; --line: #243632;
  --brand: #26A386; --brand-2: #0F5C4C; --brand-soft: #143A31; --on-brand: #FFFFFF;
  --accent: #F5B955; --on-accent: #2B1B00; --accent-soft: #3A2C14;
  --in: #3FCB8E; --in-soft: #123526; --out: #F27B63; --out-soft: #3B1F19; --warn: #F0B04A;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28); --shadow-lg: 0 12px 32px rgba(0,0,0,.4);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0B1412; --surface: #13201D; --surface-2: #1A2A26; --ink: #E4EEEA; --muted: #93A8A1; --line: #243632;
  --brand: #26A386; --brand-2: #0F5C4C; --brand-soft: #143A31; --on-brand: #FFFFFF;
  --accent: #F5B955; --on-accent: #2B1B00; --accent-soft: #3A2C14;
  --in: #3FCB8E; --in-soft: #123526; --out: #F27B63; --out-soft: #3B1F19; --warn: #F0B04A;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28); --shadow-lg: 0 12px 32px rgba(0,0,0,.4);
  color-scheme: dark }

*, *::before, *::after { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased }
.app { max-width: 1160px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 112px; display: flex; flex-direction: column; gap: 18px }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.015em }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: var(--on-brand); border-radius: 20px; padding: 16px 18px; box-shadow: var(--shadow-lg); position: relative; overflow: hidden }
.top::after { content: ""; position: absolute; right: -60px; top: -80px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.14), transparent 70%); pointer-events: none }
.brand { display: flex; align-items: center; gap: 12px; position: relative }
.mark { width: 44px; height: 44px; border-radius: 13px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 4px 12px rgba(0,0,0,.18) }
.mark svg { width: 26px; height: 26px }
.brand h1 { font-size: 24px; line-height: 1.05 }
.brand p { margin: 0; opacity: .8; font-size: 13px }
.month { display: flex; align-items: center; gap: 2px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 4px; position: relative }
.month button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: transparent; color: inherit; font-size: 20px; line-height: 1 }
.month button:hover { background: rgba(255,255,255,.18) }
.month span { min-width: 140px; text-align: center; font-weight: 700; text-transform: capitalize }

/* Tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; overflow: visible; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-sm) }
.tabs::-webkit-scrollbar { display: none }
.tabs button { flex: none; display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; padding: 8px 12px; border-radius: 10px; font-weight: 700; font-size: 14px; color: var(--muted) }
.tabs button svg { width: 18px; height: 18px; flex: none }
.tabs button:hover { color: var(--ink); background: var(--surface-2) }
.tabs button[aria-selected="true"] { color: var(--brand); background: var(--brand-soft) }
@media (max-width: 640px) { .tabs { flex-wrap: wrap; gap: 4px } .tabs button { padding: 7px 10px; font-size: 13px } }

.banner { background: var(--accent-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 14px; border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent) }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; box-shadow: var(--shadow-sm) }
.card h2 { font-size: 17px; margin-bottom: 12px }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 14px }
.card-head h2 { margin: 0 }
.grid { display: grid; gap: 16px }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)) }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 12px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden }
.kpi .lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 6px }
.kpi .lbl::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--k, var(--brand)) }
.kpi.k-in { --k: var(--in) } .kpi.k-out { --k: var(--out) } .kpi.k-acc { --k: var(--accent) }
.kpi .val { font: 700 26px/1.2 var(--f-display); letter-spacing: -.02em; overflow-wrap: anywhere }
.kpi .sub { font-size: 13px; color: var(--muted) }
.kpi.hero { background: linear-gradient(140deg, var(--brand), var(--brand-2)); color: var(--on-brand); border-color: transparent; box-shadow: var(--shadow-lg) }
.kpi.hero .lbl, .kpi.hero .sub { color: rgba(255,255,255,.8) }
.kpi.hero .lbl::before { background: var(--accent) }
.pos { color: var(--in) } .neg { color: var(--out) }
.kpi.hero .neg { color: #FFD0C6 }

.link { background: none; border: 0; color: var(--brand); font-weight: 700; padding: 0 }
.link:hover { text-decoration: underline; text-underline-offset: 3px }
.muted { color: var(--muted) }
.small { font-size: 13px }

/* Category bars */
.cats { display: flex; flex-direction: column; gap: 14px }
.cat-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: 14px; align-items: center }
.cat-row .name { min-width: 0; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.cat-row .amt { text-align: right; font-weight: 700 }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; background: var(--c, var(--muted)) }
.bar { grid-column: 1 / -1; position: relative; height: 8px; background: var(--surface-2); border-radius: 4px }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--c, var(--brand)) }
.bar i.ok { background: var(--in) } .bar i.warn { background: var(--warn) } .bar i.over { background: var(--out) }
.bar b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); opacity: .45; border-radius: 1px }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted) }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block }
.chart-wrap { overflow-x: auto }
.chart-wrap svg { display: block; width: 100%; min-width: 320px; height: auto }

/* Donut */
.donut-wrap { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 20px; align-items: center }
@media (max-width: 520px) { .donut-wrap { grid-template-columns: 1fr; justify-items: center } }
.donut-wrap svg { width: 190px; height: 190px; max-width: 100% }
.donut-legend { display: flex; flex-direction: column; gap: 8px; width: 100%; min-width: 0 }
.donut-legend > div { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: center; font-size: 14px }
.donut-legend .n { overflow-wrap: anywhere }
.donut-legend .p { color: var(--muted); font-size: 12px; min-width: 36px; text-align: right }
.donut-legend strong { white-space: nowrap }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap }
.pill.ok { background: var(--in-soft); color: var(--in) }
.pill.warn { background: var(--accent-soft); color: var(--warn) }
.pill.over { background: var(--out-soft); color: var(--out) }
.alerts { display: flex; flex-wrap: wrap; gap: 8px }

/* Forms & filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end }
.filters label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 700; min-width: 0; flex: 1 1 150px }
select, input[type="text"], input[type="date"], input:not([type]) { width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; font-size: 15px; transition: border-color .15s }
select:hover, input:hover { border-color: color-mix(in srgb, var(--brand) 40%, var(--line)) }
input[type="color"] { width: 48px; height: 42px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface) }

/* Transactions */
.day { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 800; padding: 16px 0 6px }
.tx { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 8px; margin-inline: -8px; border-radius: 12px }
.tx:hover { background: var(--surface-2) }
.tx .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font: 800 13px var(--f-display); color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent) }
.tx .ico.transfer { --c: var(--muted); font-size: 17px }
.tx .main { min-width: 0 }
.tx .t1 { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tx .t2 { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tx .right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px }
.tx .money { font-weight: 800 }
.tx .acts { display: flex; gap: 10px; font-size: 13px }
.tx .acts button { background: none; border: 0; color: var(--muted); padding: 0; text-decoration: underline; text-underline-offset: 2px }
.tx .acts button.danger { color: var(--out) }
.sumline { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; font-weight: 700; padding-bottom: 4px }

/* Buttons */
.btn { border: 1px solid transparent; border-radius: 11px; padding: 10px 16px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; transition: transform .1s, box-shadow .15s, background .15s }
.btn:active { transform: translateY(1px) }
.btn.primary { background: var(--brand); color: var(--on-brand); box-shadow: 0 2px 8px color-mix(in srgb, var(--brand) 35%, transparent) }
.btn.primary:hover { background: var(--brand-2) }
.btn.ghost { background: var(--surface); border-color: var(--line) }
.btn.ghost:hover { background: var(--surface-2) }
.btn.danger { background: var(--out); color: #fff }
.btn.sm { padding: 7px 12px; font-size: 14px }
.fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 999px; padding: 14px 22px; font-weight: 800; font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.22) }
.fab:hover { filter: brightness(1.05) }

/* Goals */
.goals { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px }
.goal { display: flex; flex-direction: column; gap: 10px }
.goal h3 { font-size: 18px }
.goal .big { font: 700 22px var(--f-display) }
.goal .bar { height: 10px }
.goal .meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted) }
.goal ul { list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--muted) }
.goal li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0 }
.goal .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto }

/* Settings chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--brand-soft); color: var(--ink); border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 14px; font-weight: 600 }
.chip button { border: 0; background: none; width: 22px; height: 22px; border-radius: 50%; color: var(--muted); font-size: 16px; line-height: 1 }
.chip button:hover { background: var(--surface); color: var(--out) }
.addrow { display: flex; gap: 8px }
.addrow input { flex: 1 }

/* Empty */
.empty { text-align: center; padding: 32px 16px; color: var(--muted) }
.empty h3 { color: var(--ink); font-size: 19px; margin-bottom: 6px }
.empty p { max-width: 48ch; margin: 0 auto 16px }

/* Dialog */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(5,15,12,.5); backdrop-filter: blur(3px); display: flex; align-items: flex-end; justify-content: center; padding: 16px }
@media (min-width: 640px) { .overlay { align-items: center } }
.dialog { background: var(--surface); border-radius: 20px; width: 100%; max-width: 500px; max-height: calc(100% - 16px); overflow-y: auto; padding: 22px; box-shadow: var(--shadow-lg); border: 1px solid var(--line) }
.dialog form { display: flex; flex-direction: column; gap: 14px }
.dialog h2 { font-size: 21px }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0 }
.field > span { font-size: 13px; font-weight: 700; color: var(--muted) }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px }
.amtbox { display: flex; align-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding-right: 14px }
.amtbox input { border: 0; font: 700 26px var(--f-display); padding: 10px 14px; background: transparent; letter-spacing: -.01em }
.amtbox input:focus { outline: none } .amtbox:focus-within { outline: 2px solid var(--brand); outline-offset: 1px; background: var(--surface) }
.amtbox em { font-style: normal; font-weight: 800; color: var(--muted) }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px }
.seg.three { grid-template-columns: repeat(3, 1fr) }
.seg label { position: relative }
.seg input { position: absolute; opacity: 0; inset: 0 }
.seg span { display: block; text-align: center; padding: 9px 6px; border-radius: 9px; font-weight: 800; color: var(--muted) }
.seg input:checked + span { background: var(--surface); color: var(--ink); box-shadow: var(--shadow) }
.seg input[value="out"]:checked + span { color: var(--out) }
.seg input[value="in"]:checked + span { color: var(--in) }
.seg input:focus-visible + span { outline: 2px solid var(--brand) }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap }
.budget-list { display: flex; flex-direction: column; gap: 8px }
.budget-list label { display: grid; grid-template-columns: auto minmax(0, 1fr) 150px; gap: 10px; align-items: center; font-size: 14px }
.budget-list input { text-align: right }
.err { color: var(--out); font-size: 13px; min-height: 1em; margin: 0 }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; max-width: calc(100% - 32px); box-shadow: var(--shadow-lg) }
.foot { font-size: 12px; color: var(--muted); text-align: center }

/* Wallets */
.wallets { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 18px }
.wallet { display: flex; flex-direction: column; gap: 12px; padding: 12px }
.wcard { position: relative; overflow: hidden; border-radius: 16px; padding: 16px 18px; min-height: 170px; display: flex; flex-direction: column; gap: 6px;
  background: linear-gradient(135deg, var(--wc) 0%, color-mix(in srgb, var(--wc) 72%, #000) 100%); color: var(--wc-ink); box-shadow: 0 8px 22px color-mix(in srgb, var(--wc) 35%, transparent) }
.wcard::before { content: ""; position: absolute; right: -40px; bottom: -70px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,.12) }
.wcard::after { content: ""; position: absolute; right: 40px; top: -60px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.08) }
.wc-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: relative; z-index: 1 }
.wc-prov { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; opacity: .85; text-align: right; overflow-wrap: anywhere }
.wc-name { font: 700 17px var(--f-display); margin-top: auto; position: relative; z-index: 1; overflow-wrap: anywhere }

function monthsUntil(iso) { if (!iso) return null; const [y, m] = iso.split("-").map(Number); const n = new Date(); return (y - n.getFullYear()) * 12 + (m - 1 - n.getMonth()); }
function goalCard(g) {
  const saved = goalSaved(g), rest = Math.max(g.target - saved, 0), p = g.target ? saved / g.target : 0;
  const ml = monthsUntil(g.deadline);
  let plan = "";
  if (rest <= 0) plan = `<span class="pill ok">Objectif atteint</span>`;
  else if (ml !== null && ml < 0) plan = `<span class="pill over">Échéance passée · il manque ${fmt(rest)}</span>`;
  else if (ml !== null) plan = `<span class="small">À mettre de côté : <strong>${fmt(rest / Math.max(ml, 1))}</strong> / mois</span>`;
  const conf = state.confirm === "goal:" + g.id;
  const last = (g.contribs || []).slice(-3).reverse();
  return `<div class="card goal"><div class="card-head" style="margin:0"><h3>${esc(g.name)}</h3><span class="muted small">${g.deadline ? "Échéance : " + esc(new Date(g.deadline + "T00:00").toLocaleDateString("fr-FR", { month: "long", year: "numeric" })) : "Sans échéance"}</span></div>
    <div><span class="big">${fmt(saved)}</span> <span class="muted">sur ${fmt(g.target)}</span></div>
    <div class="bar"><i class="${rest <= 0 ? "ok" : ""}" style="width:${Math.min(p, 1) * 100}%"></i></div>
    <div class="meta"><span>${Math.round(p * 100)} %</span>${plan}</div>
    ${last.length ? `<ul>${last.map(c => `<li><span>${esc(shortDate(c.date))} · ${esc(c.member || COMMON)}</span><span class="${c.amount < 0 ? "neg" : "pos"}">${c.amount < 0 ? "−" : "+"} ${fmt(Math.abs(c.amount))}</span></li>`).join("")}</ul>` : ""}
    <div class="row">${conf
      ? `<span class="small">Supprimer cet objectif ?</span><button class="btn danger sm" data-act="del-goal-yes" data-id="${g.id}">Supprimer</button><button class="btn ghost sm" data-act="cancel">Annuler</button>`
      : `<button class="btn primary sm" data-act="contrib" data-id="${g.id}">Verser / retirer</button><button class="btn ghost sm" data-act="edit-goal" data-id="${g.id}">Modifier</button><button class="btn ghost sm" data-act="ask" data-key="goal:${g.id}">Supprimer</button>`}</div></div>`;
}

function downloadFile(filename, text, type) {
  const blob = new Blob([text], { type }), url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function saveCSV(filename, lines) { downloadFile(filename, "\ufeff" + lines.join("\r\n"), "text/csv;charset=utf-8"); }
function backup() {
  const raw = lsGet("tetibola-local-v1") || JSON.stringify({ tx: {}, settings: null, goals: {}, wallets: {}, loans: {} });
  downloadFile(`tetibola-sauvegarde-${todayISO()}.json`, JSON.stringify({ app: "tetibola", version: 3, savedAt: new Date().toISOString(), data: JSON.parse(raw) }, null, 1), "application/json");
  lsSet("tb-lastbackup", String(Date.now())); toast("Sauvegarde exportée"); refresh();
}
async function shareBackup() {
  const raw = lsGet("tetibola-local-v1") || JSON.stringify({ tx: {}, settings: null, goals: {}, wallets: {}, loans: {} });
  const name = `tetibola-sauvegarde-${todayISO()}.json`, text = JSON.stringify({ app: "tetibola", version: 3, savedAt: new Date().toISOString(), data: JSON.parse(raw) }, null, 1);
  try {
    const file = new File([text], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Sauvegarde Tetibola", text: "Sauvegarde du budget familial du " + todayISO() });
      lsSet("tb-lastbackup", String(Date.now())); toast("Sauvegarde envoyée"); refresh(); return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  backup();
  toast("Fichier téléchargé : ouvrez Google Drive puis « + › Importer » pour l'y ranger.");
}
function restore(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result), d = j && j.app === "tetibola" ? j.data : j;
      if (!d || typeof d !== "object" || !("tx" in d)) throw new Error();
      lsSet("tetibola-local-v1", JSON.stringify(d)); lsSet("tb-lastbackup", String(Date.now()));
      location.reload();
    } catch (e) { toast("Ce fichier n'est pas une sauvegarde Tetibola valide."); }
  };
  r.readAsText(file);
}

    case "settle-bill": { const x = find(state.bills); x && openSettle(x); break; }
    case "skip-bill": { const x = find(state.bills); if (x) { const n = advance(x); await write(store.set("bills", x.id, strip(n)), n.active === false ? "Échéance terminée" : `Prochaine échéance le ${shortDate(n.next)}`); } break; }
    case "del-bill-yes": state.confirm = null; await write(store.del("bills", b.dataset.id), "Échéance supprimée"); break;
    case "notif": enableNotif(); break;
    case "rename": openRename(b.dataset.kind, b.dataset.name); break;
    case "rename-item": openRename("item", b.dataset.name); break;
    case "rm-item": { const P = state.selParent, arr = S().subcats[P].slice(); arr.splice(Number(b.dataset.i), 1); await write(store.saveSettings({ ...S(), subcats: { ...S().subcats, [P]: arr } })); break; }
    case "sel-parent": state.selParent = b.dataset.p; state.confirm = null; refresh(); break;
    case "goto-detail": state.selParent = b.dataset.p; state.tab = "detail"; lsSet("tb-tab", "detail"); render(); window.scrollTo(0, 0); break;
    case "new-parent": openParent(); break;
    case "rm-parent-yes": { const sc = { ...S().subcats }; delete sc[state.selParent]; state.confirm = null; await write(store.saveSettings({ ...S(), subcats: sc }), "Rubrique non détaillée"); break; }
    case "edit-subbudgets": openSubBudgets(); break;
    case "new-tx-cat": store && openTx(null, "out", b.dataset.p); break;
  }
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".wcard[data-act]")) { e.preventDefault(); e.target.click(); } });
document.addEventListener("change", e => {
  if (e.target.id === "restore-file" && e.target.files[0]) { restore(e.target.files[0]); return; }
  if (e.target.id === "wm-period" && state.wm) { state.wm.period = e.target.value; renderWalletModal(); return; }
  const m = { "flt-type": "type", "flt-cat": "cat", "flt-member": "member", "flt-wallet": "wallet" }[e.target.id];
  if (m) { state.f[m] = e.target.value; refresh(); }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "dlgForm" && dlgHandler) {
    const btn = f.querySelector(".btn.primary"); btn.disabled = true;
    const r = await dlgHandler(new FormData(f));
    btn.disabled = false;
    if (r === true) closeDialog(); else if (r) { const er = f.querySelector("#f-err"); er && (er.textContent = r); }
    return;
  }
  const kind = f.dataset.form; if (!kind) return;
  const inp = f.querySelector("input"), v = inp.value.trim(); if (!v) return;
  if (kind === "item") {
    const P = state.selParent, arr = (S().subcats || {})[P] || [];
    if (arr.some(x => x.toLowerCase() === v.toLowerCase())) { toast(`« ${v} » existe déjà.`); return; }
    if (await write(store.saveSettings({ ...S(), subcats: { ...S().subcats, [P]: [...arr, v] } }), `« ${v} » ajouté`)) inp.value = "";
    return;
  }
  const key = { member: "members", out: "expenseCats", in: "incomeCats" }[kind];
  const arr = S()[key];
  if (v === COMMON || arr.some(x => x.toLowerCase() === v.toLowerCase())) { toast(`« ${v} » existe déjà.`); return; }
  if (await write(store.saveSettings({ ...S(), [key]: [...arr, v] }), `« ${v} » ajouté`)) inp.value = "";
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#overlay").hidden) closeDialog(); });

/* ---------- Google Drive sync (version hébergée) ---------- */
const GD_CLIENT_ID_EMBED = "478651925867-8csfokeiqvbvfn0teu4aojpc01vj57mk.apps.googleusercontent.com";
const GD_FILE = "tetibola-donnees.json";
const GD = { token: null, exp: 0, fileId: lsGet("tb-gd-file") || null, busy: false, again: false, applying: false, status: "", t: null };
const gdClientId = () => (lsGet("tb-gd-client") || (GD_CLIENT_ID_EMBED.startsWith("__") ? "" : GD_CLIENT_ID_EMBED)).trim();
const gdOn = () => !!lsGet("tb-gd-on") && !!gdClientId();
const gdHosted = () => /^https?:$/.test(location.protocol);
function gdLoadScript() {
  return new Promise((res, rej) => {
    if (window.google && google.accounts && google.accounts.oauth2) return res();
    const sc = document.createElement("script"); sc.src = "https://accounts.google.com/gsi/client"; sc.async = true;
    sc.onload = () => res(); sc.onerror = () => rej({ code: "script" }); document.head.appendChild(sc);
  });
}
async function gdAuth(first) {
  await gdLoadScript();
  return new Promise((res, rej) => {
    const tc = google.accounts.oauth2.initTokenClient({
      client_id: gdClientId(), scope: "https://www.googleapis.com/auth/drive.file",
      callback: r => { if (r.error) return rej({ code: "auth", detail: r.error }); GD.token = r.access_token; GD.exp = Date.now() + ((r.expires_in || 3600) - 90) * 1000; lsSet("tb-gd-on", "1"); res(); },
      error_callback: e => rej({ code: "auth", detail: e && e.type })
    });
    tc.requestAccessToken({ prompt: first ? "consent" : "" });
  });
}
async function gdFetch(url, opts = {}) {
  const r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: "Bearer " + GD.token } });
  if (r.status === 401 || r.status === 403) { GD.token = null; throw { code: "auth" }; }
  return r;
}
async function gdFindFile() {
  if (GD.fileId) return GD.fileId;
  const q = encodeURIComponent(`name='${GD_FILE}' and trashed=false`);
  const r = await gdFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&orderBy=modifiedTime%20desc&fields=files(id,modifiedTime)`);
  if (!r.ok) throw { code: "net" };
  const j = await r.json();
  GD.fileId = j.files && j.files[0] ? j.files[0].id : null;
  if (GD.fileId) lsSet("tb-gd-file", GD.fileId);
  return GD.fileId;
}
async function gdDownload(id) {
  const r = await gdFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
  if (r.status === 404) { GD.fileId = null; lsSet("tb-gd-file", ""); return null; }
  if (!r.ok) throw { code: "net" };
  try { return await r.json(); } catch (e) { return null; }
}
async function gdUpload(obj) {
  const body = JSON.stringify(obj);
  if (GD.fileId) {
    const r = await gdFetch(`https://www.googleapis.com/upload/drive/v3/files/${GD.fileId}?uploadType=media`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body });
    if (r.ok) return;
    if (r.status !== 404) throw { code: "net" };
    GD.fileId = null;
  }
  const bd = "tetibola" + Date.now();
  const meta = { name: GD_FILE, mimeType: "application/json", description: "Données de l'application Tetibola (budget familial). Ne pas modifier à la main." };
  const mp = `--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;
  const r = await gdFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", { method: "POST", headers: { "Content-Type": "multipart/related; boundary=" + bd }, body: mp });
  if (!r.ok) throw { code: "net" };
  const j = await r.json(); GD.fileId = j.id; lsSet("tb-gd-file", j.id);
}
function mergeData(a, b) {
  const out = { settings: null };
  ["tx", "goals", "wallets", "loans", "bills"].forEach(n => {
    out[n] = { ...((a && a[n]) || {}) };
    Object.entries((b && b[n]) || {}).forEach(([id, v]) => { const cur = out[n][id]; if (!cur || (v._u || 0) > (cur._u || 0)) out[n][id] = v; });
  });
  const sa = a && a.settings, sb = b && b.settings;
  out.settings = !sa ? sb || null : !sb ? sa : ((sb._u || 0) > (sa._u || 0) ? sb : sa);
  return out;
}
function gdSetStatus(st) { GD.status = st; refresh(); }
async function gdSync() {
  if (!gdOn()) return;
  if (GD.busy) { GD.again = true; return; }
  if (!GD.token || Date.now() > GD.exp) { gdSetStatus("reconnect"); return; }
  GD.busy = true; gdSetStatus("sync");
  try {
    const id = await gdFindFile();
    const remote = id ? await gdDownload(id) : null;
    const rData = remote && remote.data ? remote.data : null;
    const local = store.getData();
    const merged = rData ? mergeData(local, rData) : local;
    if (JSON.stringify(merged) !== JSON.stringify(local)) { GD.applying = true; store.replaceData(merged); GD.applying = false; }
    if (!rData || JSON.stringify(merged) !== JSON.stringify(rData)) await gdUpload({ app: "tetibola", version: 4, savedAt: new Date().toISOString(), data: merged });
    lsSet("tb-gd-last", String(Date.now())); lsSet("tb-lastbackup", String(Date.now()));
    GD.busy = false; gdSetStatus("ok");
  } catch (e) {
    GD.busy = false; GD.applying = false;
    gdSetStatus(e && e.code === "auth" ? "reconnect" : "error");
  }
  if (GD.again) { GD.again = false; setTimeout(gdSync, 400); }
}
async function gdConnect() {
  if (!gdHosted()) { toast("La synchronisation Google Drive fonctionne quand l'application est ouverte depuis son adresse https (GitHub Pages), pas depuis un fichier."); return; }
  if (!gdClientId()) { openGdConfig(); return; }
  try { await gdAuth(!lsGet("tb-gd-on")); toast("Connecté à Google Drive"); gdSync(); }
  catch (e) { toast(e && e.code === "script" ? "Impossible de joindre Google. Vérifiez la connexion internet." : "Connexion Google annulée ou refusée."); gdSetStatus(lsGet("tb-gd-on") ? "reconnect" : ""); }
}
function gdDisconnect() {
  try { if (GD.token && window.google) google.accounts.oauth2.revoke(GD.token, () => {}); } catch (e) {}
  GD.token = null; lsSet("tb-gd-on", ""); gdSetStatus(""); toast("Google Drive déconnecté sur cet appareil. Les données restent dans le navigateur et dans Drive.");
}
function openGdConfig() {
  const html = `<form id="dlgForm" novalidate><h2>ID client Google</h2>
    <p class="small muted" style="margin:0">Collez l'« ID client » OAuth créé dans Google Cloud (il se termine par <code>.apps.googleusercontent.com</code>). Il est enregistré sur cet appareil ; faites-le aussi sur le téléphone, ou demandez à l'intégrer directement dans le fichier.</p>
    <label class="field"><span>ID client</span><input id="gd-cid" name="cid" value="${esc(gdClientId())}" placeholder="123456789-abc.apps.googleusercontent.com" autocomplete="off"></label>${actions}</form>`;
  openDialog(html, async fd => {
    const v = String(fd.get("cid") || "").trim();
    if (!/\.apps\.googleusercontent\.com$/.test(v)) return "Cet identifiant ne ressemble pas à un ID client Google (…apps.googleusercontent.com).";
    lsSet("tb-gd-client", v); GD.token = null; toast("ID client enregistré"); refresh(); return true;
  });
}
function gdPanel() {
  const last = Number(lsGet("tb-gd-last") || 0);
  const lastTxt = last ? new Date(last).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "jamais";
  if (!gdHosted()) return `<p class="small">Pour synchroniser ordinateur et téléphone, ouvrez l'application depuis son adresse en ligne (GitHub Pages), pas depuis un fichier téléchargé. Voir le guide d'installation.</p>`;
  if (!gdClientId()) return `<p class="small">Enregistrez automatiquement vos données dans votre Google Drive et retrouvez-les sur tous vos appareils connectés au même compte Google.</p><div class="pickrow"><button type="button" data-act="gd-config" aria-pressed="true">Saisir l'ID client Google</button></div>`;
  if (!lsGet("tb-gd-on")) return `<p class="small">ID client enregistré. Connectez votre compte Google pour activer la synchronisation.</p><div class="pickrow"><button type="button" data-act="gd-connect" aria-pressed="true">Se connecter à Google Drive</button><button type="button" data-act="gd-config">Modifier l'ID client</button></div>`;
  const st = { sync: '<span class="pill info">Synchronisation…</span>', ok: '<span class="pill ok">À jour</span>', pending: '<span class="pill warn">Modifications en attente</span>', reconnect: '<span class="pill warn">Reconnexion nécessaire</span>', error: '<span class="pill over">Échec</span>' }[GD.status] || '<span class="pill neutral">Connecté</span>';
  return `<p class="small">${st} Dernière synchronisation : <strong>${lastTxt}</strong>. Fichier Drive : <code>${GD_FILE}</code>.</p>
    <div class="pickrow"><button type="button" data-act="${GD.token ? "gd-sync" : "gd-connect"}" aria-pressed="true">${GD.token ? "Synchroniser maintenant" : "Reconnecter Google Drive"}</button><button type="button" data-act="gd-disconnect">Déconnecter</button><button type="button" data-act="gd-config">Modifier l'ID client</button></div>
    <p class="small muted">Chaque modification est envoyée vers Drive quelques secondes après la saisie, et les données de l'autre appareil sont récupérées toutes les minutes. Google demande de reconnecter environ une fois par heure d'utilisation (un clic).</p>`;
}
function gdBannerMsg() {
  if (!gdOn() || !gdHosted()) return "";
  if (GD.status === "reconnect" || !GD.token) return `Google Drive : reconnectez-vous pour synchroniser. <button class="btn primary sm" data-act="gd-connect" style="margin-left:6px">Reconnecter</button>`;
  if (GD.status === "error") return `La synchronisation Google Drive a échoué (connexion internet ?). <button class="btn primary sm" data-act="gd-sync" style="margin-left:6px">Réessayer</button>`;
  return "";
}
window.addEventListener("tb-local-change", () => {
  if (GD.applying || !gdOn()) return;
  clearTimeout(GD.t); GD.t = setTimeout(gdSync, 2500);
  if (GD.token) GD.status = "pending";
});
setInterval(() => { if (document.visibilityState === "visible" && GD.token) gdSync(); }, 60000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && GD.token) gdSync(); });

/* ---------- Boot ---------- */
async function boot() {
  render();
  let db = null;
  /* version locale : pas de synchronisation */
  store = db ? makeRemote(db) : makeLocal();
  state.mode = db ? "db" : "local";
  $("#foot").textContent = db ? "Données partagées et synchronisées entre les membres de la famille." : "";
  let first = true;
  store.subSettings(s => {
    state.settings = { ...structuredClone(DEFAULTS), ...(s || {}) };
    (first || ["tx", "cats", "detail"].includes(state.tab)) ? render() : refresh(); first = false;
  });
  store.sub("wallets", w => { state.wallets = w; subscribeTx(); state.tab === "tx" ? render() : refresh(); });
  store.sub("goals", g => { state.goals = g; refresh(); });
  store.sub("bills", x => { state.bills = x; refresh(); notifyDue(); });
  setInterval(() => { notifyDue(); refresh(); }, 36e5);
  store.sub("loans", l => { state.loans = l.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)); refresh(); });
  subscribeTx();
  render();
}
boot();
})();
